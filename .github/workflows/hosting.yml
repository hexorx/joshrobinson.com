name: Static hosting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: npm run check
      - if: github.event_name == 'pull_request'
        run: npm run test:hosting
      - run: npm run build
      - if: github.event_name == 'pull_request'
        run: npm run check:links
      - if: github.event_name == 'pull_request'
        run: npm run deploy:dry-run
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: |
            dist/
            wrangler.jsonc
          retention-days: 7
          if-no-files-found: error

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEWS_ENABLED: ${{ vars.CLOUDFLARE_PREVIEWS_ENABLED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check preview prerequisites
        id: gate
        shell: bash
        run: |
          if [[ "$PREVIEWS_ENABLED" != 'true' ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Preview skipped: Josh must approve public preview exposure, then CLOUDFLARE_PREVIEWS_ENABLED must be true.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Preview skipped: Josh must supply CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: static-preview
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy isolated PR Worker
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy --name joshrobinson-preview-pr-${{ github.event.pull_request.number }}
      - name: Verify preview and post URL
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url || new URL(url).protocol !== 'https:' || !new URL(url).hostname.endsWith('.workers.dev')) {
              throw new Error('Wrangler did not return an HTTPS workers.dev preview URL');
            }
            for (const path of ['/', '/resume/', '/rss.xml', '/sitemap-index.xml']) {
              const response = await fetch(new URL(path, url), { signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`Preview ${path}: HTTP ${response.status}`);
            }
            const missing = await fetch(new URL('/hex-441-missing-page', url), { signal: AbortSignal.timeout(30000) });
            if (missing.status !== 404) throw new Error('Missing page must return HTTP 404');
            const marker = '<!-- cloudflare-static-preview -->';
            const body = `${marker}\nPreview for ${context.payload.pull_request.head.sha}: ${url}\n\nIsolated PR Worker; no production domain attached.`;
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ ...params, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, body });
